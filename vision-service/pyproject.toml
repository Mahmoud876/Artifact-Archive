[project]
name = "seshat-vision-service"
version = "0.1.0"
description = "Local open-vocabulary detection and segmentation for Seshat"
requires-python = ">=3.12,<3.13"
dependencies = [
  "einops>=0.8.1",
  "fastapi>=0.116.0",
  "numpy>=2.1.0",
  "opencv-python-headless>=4.11.0.86",
  "pillow>=11.3.0",
  "python-multipart>=0.0.20",
  "safetensors>=0.5.3",
  "timm>=1.0.19",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "transformers>=4.53.0,<6",
  "uvicorn[standard]>=0.35.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
